services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: acervo
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - acervo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U acervo -d acervo" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  acervo-pgdata: