server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  
spring:
  application:
    name: acervo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/acervo}
    username: ${SPRING_DATASOURCE_USERNAME:acervo}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test-key}
      chat:
        temperature: 0.1
        model: gpt-4o-mini
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      image:
        enabled: false
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  issuer: acervo-backend
  access-token-ttl: PT1H
  refresh-token-ttl: P30D
  private-key: ${JWT_PRIVATE_KEY:file:private.pem}
  public-key: ${JWT_PUBLIC_KEY:file:public.pem}

aws:
  s3:
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:test-key}
    secret-key: ${S3_SECRET_KEY:test-secret}
    bucket-name: ${S3_BUCKET_NAME:test-bucket}

logging:
  level:
    org.springframework.ai.chat.model.MessageAggregator: "off"