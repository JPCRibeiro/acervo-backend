server:
  port: ${PORT:8080}

spring:
  application:
    name: acervo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/acervo}
    username: ${SPRING_DATASOURCE_USERNAME:acervo}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test-key}
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      image:
        enabled: false
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE